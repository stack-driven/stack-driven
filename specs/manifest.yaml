      revisit_when: Revisit before tech stack, compliance, deployment, or any externally constrained decision.
      revisit_owner: Product/technical lead
    relevance:
      load_priority: high
      load_when:
        - Selecting stack, architecture, compliance, deployment, integrations, or cost model.
      prefer_ctx: true
      phase_ii_hint: Treat absence as an explicit risk unless skip rationale exists.

