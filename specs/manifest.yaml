schema_version: 1
manifest_id: stack-driven.spec-authority
status: active
review_status: ai_drafted
last_updated: "2026-05-11"
purpose: >-
  Canonical registry of Stack-Driven specs, sessions, dependencies,
  lifecycle status, output paths, context files, optionality, and loading hints.

authority:
  source_of_truth: specs/manifest.yaml
  product_output_root: product-guidelines/
  ctx_files_are_authority: false
  lifecycle_values:
    - active
    - deferred
    - skipped
    - superseded
    - deprecated
  review_status_values:
    - ai_drafted
    - human_reviewed
    - authoritative
  required_mode_values:
    - required
    - recommended
    - conditional
    - optional
    - support
  conflict_hierarchy:
    - rank: 1
      source: Human-reviewed or authoritative spec listed in this manifest
    - rank: 2
      source: Approved issue plan or reviewed ADR that explicitly amends a spec
    - rank: 3
      source: Implementation detail in code or command files
    - rank: 4
      source: AI-drafted generated output
    - rank: 5
      source: Templates, examples, or informal notes
  default_generated_review_status: ai_drafted
  promotion_rule: >-
    A generated spec becomes human_reviewed or authoritative only after an
    explicit human review/checkpoint records that status.
  template_policy:
    template_paths_are_authoritative_for_structure: true
    missing_template_means: Use the manifest command/sub-agent workflow rather than guessing a template filename.

loading_defaults:
  prefer_ctx_when_available: true
  missing_ctx_means: Use the full source output path.
  phase_ii_note: >-
    Phase II loaders should use relevance hints to choose the smallest useful
    spec set while preserving dependency and conflict rules.

specs:
  - id: journey.user
    title: User Journey
    session: "1"
    command: /refine-journey
    group: core
    kind: product_spec
    purpose: Defines the primary user, problem, journey, value, and metrics root for all downstream decisions.
    required_mode: required
    condition: null
    lifecycle: active
    default_review_status: ai_drafted
    dependencies:
      required: []
      optional: []
    root_dependency: true
    outputs:
      paths:
        - product-guidelines/00-user-journey.md
      ctx_paths:
        - product-guidelines/00-user-journey.ctx.md
    templates:
      paths:
        - templates/00-user-journey-interview-template.md
        - templates/00-user-journey-template.md
      role: interview_and_structure
    skip_policy:
      allowed: false
      skip_reason: null
      revisit_when: null
      revisit_owner: null
    relevance:
      load_priority: critical
      load_when:
        - Starting or validating any cascade.
        - Resolving journey traceability conflicts.
      prefer_ctx: true
      phase_ii_hint: Always include directly or transitively for product-facing work.

