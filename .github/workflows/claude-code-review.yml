name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    # Optional: Only run on specific file changes
    # Uncomment and customize as needed:
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "apps/**/*"
    #   - "services/**/*"

  # Allow manual trigger for re-reviews
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to review'
        required: true
        type: number

jobs:
  claude-review:
    # Optional: Filter by PR author or type
    # Uncomment to only review external contributors:
    # if: |
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR' ||
    #   github.event.pull_request.author_association == 'CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Need full history for diff analysis

      - name: Get PR number
        id: get-pr
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "pr_number=${{ github.event.inputs.pr_number }}" >> $GITHUB_OUTPUT
          else
            echo "pr_number=${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT
          fi

      - name: Get review iteration count
        id: get-iteration
        run: |
          # Count how many previous review rounds exist for this PR
          REVIEW_COUNT=$(gh pr view ${{ steps.get-pr.outputs.pr_number }} --json comments --jq '[.comments[] | select(.author.login=="github-actions[bot]" and (.body | contains("Code Review - Round")))] | length' || echo "0")
          NEXT_ROUND=$((REVIEW_COUNT + 1))
          echo "review_count=$REVIEW_COUNT" >> $GITHUB_OUTPUT
          echo "next_round=$NEXT_ROUND" >> $GITHUB_OUTPUT
          echo "📊 This will be review round $NEXT_ROUND (previous rounds: $REVIEW_COUNT)"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # Review prompt focused on Stack-Driven principles with severity tracking
          prompt: |
            Review pull request #${{ steps.get-pr.outputs.pr_number }} for this Stack-Driven product.

            **Review Round:** ${{ steps.get-iteration.outputs.next_round }} of 5 maximum
            **Previous Rounds:** ${{ steps.get-iteration.outputs.review_count }}

            ## IMPORTANT: Read Validation Checklist First

            **Before reviewing code, read the framework consistency rules:**
            ```bash
            Read VALIDATION-CHECKLIST.md
            ```

            This checklist defines Stack-Driven framework-specific validation rules. Apply these rules (especially Tier 1: Rules 1.4, 2.1, 3.1, 3.2) when reviewing changes to:
            - `.claude/commands/*.md` (command files)
            - `templates/*.md` (template files)
            - `CLAUDE.md`, `README.md`, `CASCADE-DEPENDENCIES.md` (documentation)

            ## Review Criteria

            **1. Framework Consistency (from VALIDATION-CHECKLIST.md)**
            - File reference integrity (Rules 1.1-1.4)
            - Session numbering consistency (Rules 2.1-2.3)
            - Naming consistency - tables, epics, commands (Rules 3.1-3.3)
            - Propagation pattern completeness (Rules 4.1-4.3)

            **2. Product Guidelines Alignment**
            - Check if changes align with product-guidelines (if they exist)
            - UI changes: Verify against `product-guidelines/06-design-system.md`
            - API changes: Verify against `product-guidelines/08-api-contracts.md`
            - Database changes: Verify against `product-guidelines/07-database-schema.md`
            - Tech stack: Verify against `product-guidelines/02-tech-stack.md`

            **3. Journey Traceability**
            - Does PR description reference user journey step?
            - Is user value clearly articulated?
            - Does this align with product mission?

            **4. Code Quality**
            - Follows existing code patterns and conventions
            - Proper error handling
            - Appropriate test coverage
            - Type safety (if applicable)
            - Security best practices

            **5. Stack-Driven Philosophy**
            - Journey-first thinking (not technology-first)
            - Specific implementation (not generic)
            - Decision traceability (changes reference guidelines)

            ## Review Process

            1. **Read PR details:**
               ```bash
               gh pr view ${{ steps.get-pr.outputs.pr_number }} --json title,body,files
               gh pr diff ${{ steps.get-pr.outputs.pr_number }}
               ```

            2. **Check for product-guidelines:**
               - Look for `product-guidelines/` directory
               - If exists, read relevant guidelines based on changed files
               - If doesn't exist, focus on code quality only

            3. **Analyze changes:**
               - Detect change type (UI, API, database, infrastructure)
               - Load appropriate guidelines
               - Compare implementation vs specifications

            4. **Provide structured feedback with severity levels:**

               Format your review as:

               ```markdown
               ## Code Review - Round ${{ steps.get-iteration.outputs.next_round }}/5

               ### 🔴 High Priority (blocking - must fix)
               {List critical issues that MUST be fixed before merging}
               {Use format: `file.ts:line` - Issue description with specific fix needed}
               {Include: VALIDATION-CHECKLIST.md Tier 1 rule violations (Rules 1.4, 2.1, 3.1, 3.2)}
               {Examples: Security vulnerabilities, data corruption risks, breaking changes without migration, file reference mismatches, session numbering errors}

               ### 🟡 Medium Priority (should fix)
               {List important issues that should be addressed}
               {Use format: `file.ts:line` - Issue description with specific fix needed}
               {Examples: Code quality issues, missing tests, guideline violations, tech debt}

               ### 🟢 Low Priority (optional improvements)
               {List nice-to-have improvements}
               {Use format: `file.ts:line` - Suggestion for improvement}
               {Examples: Style improvements, refactoring opportunities, documentation}

               ### ✅ Strengths
               - {Specific positive observations}

               ### 📊 Summary
               - **High priority issues:** {X}
               - **Medium priority issues:** {Y}
               - **Low priority issues:** {Z}
               - **Review round:** ${{ steps.get-iteration.outputs.next_round }} of 5

               **Framework Consistency (VALIDATION-CHECKLIST.md):**
               - Rule 1.4 (Context vs Full File): ✅ Pass / ⚠️ Issue found
               - Rule 2.1 (Session Numbering): ✅ Pass / ⚠️ Issue found
               - Rule 3.1 (Table Names): ✅ Pass / ⚠️ Issue found
               - Rule 3.2 (Epic Numbers): ✅ Pass / ⚠️ Issue found

               **Product Guidelines Alignment:**
               - {Guideline check 1}: ✅ Pass / ⚠️ Issue found
               - {Guideline check 2}: ✅ Pass / ⚠️ Issue found

               **Journey Traceability:**
               - {Assessment of journey alignment}

               **Code Quality:**
               - {Assessment of code patterns, tests, types, security}

               ---
               *This review was generated by Claude Code (Round ${{ steps.get-iteration.outputs.next_round }}/5)*
               ```

            5. **Post review:**
               ```bash
               gh pr comment ${{ steps.get-pr.outputs.pr_number }} --body-file review.md
               ```

            ## Severity Guidelines

            **🔴 High Priority (blocking):**
            - VALIDATION-CHECKLIST.md Tier 1 rule violations (1.4, 2.1, 3.1, 3.2)
            - Security vulnerabilities
            - Data corruption or loss risks
            - Breaking API changes without migration plan
            - Critical bugs
            - Severe performance issues
            - Hard-coded secrets or credentials

            **🟡 Medium Priority (should fix):**
            - VALIDATION-CHECKLIST.md Tier 2 rule violations (1.1, 1.2, 4.1-4.3, 6.3)
            - Code quality issues (complexity, duplication)
            - Missing or inadequate tests
            - Guideline violations (tech stack, design system)
            - Missing error handling
            - Type safety issues
            - Accessibility violations
            - Moderate performance concerns

            **🟢 Low Priority (optional):**
            - Code style improvements
            - Documentation enhancements
            - Refactoring opportunities
            - Minor optimizations
            - Naming suggestions

            ## Important Notes

            - **Be constructive**: Focus on helping, not criticizing
            - **Be specific**: Reference exact files and line numbers for EVERY issue
            - **Be balanced**: Highlight both strengths and areas for improvement
            - **Use severity levels**: Categorize every issue as 🔴 High, 🟡 Medium, or 🟢 Low
            - **Check CLAUDE.md**: Use repository-specific guidelines if they exist
            - **Respect context**: If product-guidelines don't exist, focus on code quality only

            **Your goal:** Help maintain code quality and alignment with Stack-Driven philosophy.

          # Allow tools for PR analysis and commenting
          claude_args: '--allowed-tools "Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh pr list:*),Bash(gh issue view:*),Read,Grep,Glob"'

      - name: Check if auto-fix should be triggered
        if: success()
        id: check-auto-fix
        run: |
          # Get the latest review comment
          LATEST_REVIEW=$(gh pr view ${{ steps.get-pr.outputs.pr_number }} --json comments --jq '[.comments[] | select(.author.login=="github-actions[bot]" and (.body | contains("Code Review - Round")))] | last | .body')

          # Count high and medium priority issues
          HIGH_COUNT=$(echo "$LATEST_REVIEW" | grep -A 100 "🔴 High Priority" | grep -B 100 "🟡 Medium Priority" | grep -c "^\-" || echo "0")
          MEDIUM_COUNT=$(echo "$LATEST_REVIEW" | grep -A 100 "🟡 Medium Priority" | grep -B 100 "🟢 Low Priority" | grep -c "^\-" || echo "0")

          CURRENT_ROUND=${{ steps.get-iteration.outputs.next_round }}

          echo "high_count=$HIGH_COUNT" >> $GITHUB_OUTPUT
          echo "medium_count=$MEDIUM_COUNT" >> $GITHUB_OUTPUT
          echo "current_round=$CURRENT_ROUND" >> $GITHUB_OUTPUT

          # Trigger auto-fix if:
          # 1. We have high or medium priority issues
          # 2. We haven't exceeded max rounds (5)
          if [ "$CURRENT_ROUND" -lt 5 ] && [ $((HIGH_COUNT + MEDIUM_COUNT)) -gt 0 ]; then
            echo "should_auto_fix=true" >> $GITHUB_OUTPUT
            echo "🔧 Will trigger auto-fix (Round $CURRENT_ROUND/5, Issues: $HIGH_COUNT high + $MEDIUM_COUNT medium)"
          else
            echo "should_auto_fix=false" >> $GITHUB_OUTPUT
            if [ "$CURRENT_ROUND" -ge 5 ]; then
              echo "⛔ Max rounds reached, will NOT trigger auto-fix"
            else
              echo "✅ No issues found, auto-fix not needed"
            fi
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger auto-fix if needed
        if: success() && steps.check-auto-fix.outputs.should_auto_fix == 'true'
        run: |
          gh pr comment ${{ steps.get-pr.outputs.pr_number }} --body "@claude-fix-review"
          echo "🔧 Auto-fix triggered for review round ${{ steps.check-auto-fix.outputs.current_round }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Add review-blocked label if max rounds reached
        if: success() && steps.check-auto-fix.outputs.current_round == '5' && (steps.check-auto-fix.outputs.high_count != '0' || steps.check-auto-fix.outputs.medium_count != '0')
        run: |
          gh pr edit ${{ steps.get-pr.outputs.pr_number }} --add-label "review-blocked"
          gh pr comment ${{ steps.get-pr.outputs.pr_number }} --body "⛔ **Manual intervention required**

          This PR has reached the maximum of 5 automated review/fix rounds with unresolved issues.

          **Remaining issues:**
          - 🔴 High priority: ${{ steps.check-auto-fix.outputs.high_count }}
          - 🟡 Medium priority: ${{ steps.check-auto-fix.outputs.medium_count }}

          **Next steps:**
          1. Review the latest code review findings above
          2. Manually fix the remaining issues
          3. Push your changes to this PR
          4. Remove the \`review-blocked\` label to re-enable automation

          **Why was this blocked?**
          Automated fix cycles are limited to 5 rounds to prevent infinite loops and excessive resource usage. This usually indicates complex issues that require human judgment."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Comment on failure
        if: failure()
        run: |
          gh pr comment ${{ steps.get-pr.outputs.pr_number }} \
            --body "❌ Code review failed to complete. Please check the workflow run for details: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
