name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    # Optional: Only run on specific file changes
    # Uncomment and customize as needed:
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "apps/**/*"
    #   - "services/**/*"

  # Allow manual trigger for re-reviews
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to review'
        required: true
        type: number

jobs:
  claude-review:
    # Optional: Filter by PR author or type
    # Uncomment to only review external contributors:
    # if: |
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR' ||
    #   github.event.pull_request.author_association == 'CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Need full history for diff analysis

      - name: Get PR number
        id: get-pr
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "pr_number=${{ github.event.inputs.pr_number }}" >> $GITHUB_OUTPUT
          else
            echo "pr_number=${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT
          fi

      - name: Get review iteration count
        id: get-iteration
        run: |
          # Count how many previous review rounds exist for this PR
          # Look for both "Code Review - Round" and "## Code Review" patterns
          REVIEW_COUNT=$(gh pr view ${{ steps.get-pr.outputs.pr_number }} --json comments --jq '[.comments[] | select(.author.login=="github-actions[bot]" and ((.body | contains("Code Review - Round")) or (.body | contains("## Code Review"))))] | length' || echo "0")
          NEXT_ROUND=$((REVIEW_COUNT + 1))
          echo "review_count=$REVIEW_COUNT" >> $GITHUB_OUTPUT
          echo "next_round=$NEXT_ROUND" >> $GITHUB_OUTPUT
          echo "📊 This will be review round $NEXT_ROUND (previous rounds: $REVIEW_COUNT)"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Debug Claude Action Environment
        run: |
          echo "📊 Debug Information:"
          echo "- Event Name: ${{ github.event_name }}"
          echo "- PR Number: ${{ steps.get-pr.outputs.pr_number }}"
          echo "- Token Set: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}"

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # Allow bots to trigger this action (fixes the error)
          allowed_bots: '*'

          # Review prompt focused on Stack-Driven principles with severity tracking
          prompt: |
            Review pull request #${{ steps.get-pr.outputs.pr_number }} for this Stack-Driven product.

            **Review Round:** ${{ steps.get-iteration.outputs.next_round }} of 5 maximum
            **Previous Rounds:** ${{ steps.get-iteration.outputs.review_count }}

            ## IMPORTANT: Read Validation Checklist First

            **Before reviewing code, read the framework consistency rules:**
            ```bash
            Read VALIDATION-CHECKLIST.md
            ```

            This checklist defines Stack-Driven framework-specific validation rules. Apply these rules (especially Tier 1: Rules 1.4, 2.1, 3.1, 3.2) when reviewing changes to:
            - `.claude/commands/*.md` (command files)
            - `templates/*.md` (template files)
            - `CLAUDE.md`, `README.md`, `CASCADE-DEPENDENCIES.md` (documentation)

            ## Review Criteria

            **1. Framework Consistency (from VALIDATION-CHECKLIST.md)**
            - File reference integrity (Rules 1.1-1.4)
            - Session numbering consistency (Rules 2.1-2.3)
            - Naming consistency - tables, epics, commands (Rules 3.1-3.3)
            - Propagation pattern completeness (Rules 4.1-4.3)

            **2. Product Guidelines Alignment**
            - Check if changes align with product-guidelines (if they exist)
            - UI changes: Verify against `product-guidelines/06-design-system.md`
            - API changes: Verify against `product-guidelines/08-api-contracts.md`
            - Database changes: Verify against `product-guidelines/07-database-schema.md`
            - Tech stack: Verify against `product-guidelines/02-tech-stack.md`

            **3. Journey Traceability**
            - Does PR description reference user journey step?
            - Is user value clearly articulated?
            - Does this align with product mission?

            **4. Code Quality**
            - Follows existing code patterns and conventions
            - Proper error handling
            - Appropriate test coverage
            - Type safety (if applicable)
            - Security best practices

            **5. Stack-Driven Philosophy**
            - Journey-first thinking (not technology-first)
            - Specific implementation (not generic)
            - Decision traceability (changes reference guidelines)

            ## Review Process

            1. **Read PR details:**
               ```bash
               gh pr view ${{ steps.get-pr.outputs.pr_number }} --json title,body,files
               gh pr diff ${{ steps.get-pr.outputs.pr_number }}
               ```

            2. **Check for product-guidelines:**
               - Look for `product-guidelines/` directory
               - If exists, read relevant guidelines based on changed files
               - If doesn't exist, focus on code quality only

            3. **Analyze changes:**
               - Detect change type (UI, API, database, infrastructure)
               - Load appropriate guidelines
               - Compare implementation vs specifications

            4. **Provide structured feedback with severity levels:**

               Format your review as:

               ```markdown
               ## Code Review - Round ${{ steps.get-iteration.outputs.next_round }}/5

               ### 🔴 High Priority (blocking - must fix)
               {List critical issues that MUST be fixed before merging}
               {Use format: `file.ts:line` - Issue description with specific fix needed}
               {Include: VALIDATION-CHECKLIST.md Tier 1 rule violations (Rules 1.4, 2.1, 3.1, 3.2)}
               {Examples: Security vulnerabilities, data corruption risks, breaking changes without migration, file reference mismatches, session numbering errors}

               ### 🟡 Medium Priority (should fix)
               {List important issues that should be addressed}
               {Use format: `file.ts:line` - Issue description with specific fix needed}
               {Examples: Code quality issues, missing tests, guideline violations, tech debt}

               ### 🟢 Low Priority (optional improvements)
               {List nice-to-have improvements}
               {Use format: `file.ts:line` - Suggestion for improvement}
               {Examples: Style improvements, refactoring opportunities, documentation}

               ### ✅ Strengths
               - {Specific positive observations}

               ### 📊 Summary
               - **High priority issues:** {X}
               - **Medium priority issues:** {Y}
               - **Low priority issues:** {Z}
               - **Review round:** ${{ steps.get-iteration.outputs.next_round }} of 5

               **Framework Consistency (VALIDATION-CHECKLIST.md):**
               - Rule 1.4 (Context vs Full File): ✅ Pass / ⚠️ Issue found
               - Rule 2.1 (Session Numbering): ✅ Pass / ⚠️ Issue found
               - Rule 3.1 (Table Names): ✅ Pass / ⚠️ Issue found
               - Rule 3.2 (Epic Numbers): ✅ Pass / ⚠️ Issue found

               **Product Guidelines Alignment:**
               - {Guideline check 1}: ✅ Pass / ⚠️ Issue found
               - {Guideline check 2}: ✅ Pass / ⚠️ Issue found

               **Journey Traceability:**
               - {Assessment of journey alignment}

               **Code Quality:**
               - {Assessment of code patterns, tests, types, security}

               ---
               *This review was generated by Claude Code (Round ${{ steps.get-iteration.outputs.next_round }}/5)*
               ```

            5. **Output the review:**
               Simply output the complete review markdown. Do not attempt to post it - the workflow will handle posting.

            ## Severity Guidelines

            **🔴 High Priority (blocking):**
            - VALIDATION-CHECKLIST.md Tier 1 rule violations (1.4, 2.1, 3.1, 3.2)
            - Security vulnerabilities
            - Data corruption risks
            - Breaking changes without migration
            - Framework consistency violations

            **🟡 Medium Priority (should fix):**
            - Code quality issues
            - Missing tests
            - Guideline deviations
            - Performance concerns
            - Technical debt

            **🟢 Low Priority (nice-to-have):**
            - Style improvements
            - Refactoring opportunities
            - Documentation updates
            - Code organization

            ## Important Notes

            - If PR has more than 5 review rounds, suggest manual review to avoid fatigue
            - Always check if `product-guidelines/` directory exists before validating against it
            - Be specific with line numbers and filenames for actionable feedback
            - Balance thoroughness with pragmatism - focus on impactful issues

          # Use the review-pr slash command (from your Stack-Driven framework)
          # This ensures consistency with your manual review process
          claude_args: '--allowed-tools "Bash(gh:*),Read,Grep,Glob"'

      - name: Debug Claude Action Outputs
        if: always()
        run: |
          echo "🔍 Checking Claude Action outputs:"
          echo "- Outcome: ${{ steps.claude-review.outcome }}"
          echo "- Conclusion: ${{ steps.claude-review.conclusion }}"
          echo ""
          echo "Available outputs:"
          echo "- stdout: '${{ steps.claude-review.outputs.stdout }}'"
          echo "- stderr: '${{ steps.claude-review.outputs.stderr }}'"
          echo "- output: '${{ steps.claude-review.outputs.output }}'"
          echo "- response: '${{ steps.claude-review.outputs.response }}'"
          echo "- result: '${{ steps.claude-review.outputs.result }}'"
          echo ""
          echo "Full step context (JSON):"
          echo '${{ toJSON(steps.claude-review) }}'

      - name: Post review comment
        if: success()
        run: |
          # Try multiple output methods to capture the Claude review
          REVIEW_CONTENT=""

          # Method 1: Try stdout
          if [ -n "${{ steps.claude-review.outputs.stdout }}" ]; then
            echo "✅ Found review in stdout"
            REVIEW_CONTENT="${{ steps.claude-review.outputs.stdout }}"
          # Method 2: Try output
          elif [ -n "${{ steps.claude-review.outputs.output }}" ]; then
            echo "✅ Found review in output"
            REVIEW_CONTENT="${{ steps.claude-review.outputs.output }}"
          # Method 3: Try response
          elif [ -n "${{ steps.claude-review.outputs.response }}" ]; then
            echo "✅ Found review in response"
            REVIEW_CONTENT="${{ steps.claude-review.outputs.response }}"
          # Method 4: Try result
          elif [ -n "${{ steps.claude-review.outputs.result }}" ]; then
            echo "✅ Found review in result"
            REVIEW_CONTENT="${{ steps.claude-review.outputs.result }}"
          # Method 5: Check if a review file was created
          elif [ -f "claude_review.md" ]; then
            echo "✅ Found review in claude_review.md file"
            REVIEW_CONTENT=$(cat claude_review.md)
          elif [ -f "review.md" ]; then
            echo "✅ Found existing review.md file"
            REVIEW_CONTENT=$(cat review.md)
          fi

          # Save the review content to a file
          if [ -n "$REVIEW_CONTENT" ]; then
            echo "$REVIEW_CONTENT" > review.md
          else
            echo "❌ No review content found in any expected location"

            # Create a fallback message
            cat << 'EOF' > review.md
          ## Code Review - Round ${{ steps.get-iteration.outputs.next_round }}/5

          ⚠️ **Automated review generation failed**

          The Claude Code review action completed but produced no output. This could be due to:
          - Missing or invalid CLAUDE_CODE_OAUTH_TOKEN secret
          - API rate limiting or connection issues
          - Workflow configuration issues with output capture

          Please check:
          1. Repository secret `CLAUDE_CODE_OAUTH_TOKEN` is set correctly
          2. GitHub Actions logs for debug output to identify where the review should be
          3. The Claude Code Action documentation for correct output format

          Debug information from the action:
          - Action outcome: ${{ steps.claude-review.outcome }}
          - PR number: ${{ steps.get-pr.outputs.pr_number }}
          - Review round: ${{ steps.get-iteration.outputs.next_round }}

          ---
          *Manual review recommended for this PR*
          EOF
          fi

          # Verify the review file has content before posting
          if [ ! -s review.md ]; then
            echo "❌ Review file is still empty after all attempts"
            exit 1
          fi

          # Post the review as a comment
          gh pr comment ${{ steps.get-pr.outputs.pr_number }} --body-file review.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Add labels on completion
        if: success()
        run: |
          # Add reviewed label to PR
          gh pr edit ${{ steps.get-pr.outputs.pr_number }} --add-label "reviewed" || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create summary
        if: success()
        run: |
          echo "### ✅ PR #${{ steps.get-pr.outputs.pr_number }} Reviewed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Code review completed successfully (Round ${{ steps.get-iteration.outputs.next_round }})." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Next steps:**" >> $GITHUB_STEP_SUMMARY
          echo "1. Review the feedback posted on the PR" >> $GITHUB_STEP_SUMMARY
          echo "2. Address any high priority issues" >> $GITHUB_STEP_SUMMARY
          echo "3. Consider medium priority improvements" >> $GITHUB_STEP_SUMMARY
          echo "4. Request re-review if needed" >> $GITHUB_STEP_SUMMARY